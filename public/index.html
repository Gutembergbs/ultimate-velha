<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="Ultimate Jogo da Velha: estratégia, partidas locais, IA e modo online.">
    <title>Ultimate Jogo da Velha</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: #e7edf7;
      }

      body {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(24px, 6vw, 48px);
        border: 1px solid #24344d;
        border-radius: 20px;
        background: linear-gradient(145deg, #111a2c, #0d1728);
      }

      .eyebrow {
        color: #67e8f9;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .16em;
      }

      h1 {
        margin: 20px 0 14px;
        font-size: clamp(32px, 7vw, 52px);
        line-height: 1.05;
      }

      p {
        color: #a8b5c9;
        line-height: 1.7;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        display: inline-block;
        padding: 12px 16px;
        border: 1px solid #2a3c55;
        border-radius: 9px;
        color: #e7edf7;
        font-weight: 700;
        text-decoration: none;
      }

      a:first-child {
        border-color: #087e8b;
        background: #087e8b;
      }

      footer {
        margin-top: 32px;
        color: #7e8da2;
        font-size: 12px;
      }

      footer a {
        padding: 0;
        border: 0;
        color: #67e8f9;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">JOGO DE ESTRATÉGIA</p>
      <h1>Ultimate Jogo da Velha</h1>
      <p>
        Conquiste três tabuleiros em linha. Jogue localmente, desafie a
        inteligência artificial ou convide alguém para uma partida online.
      </p>
      <nav aria-label="Links do aplicativo">
        <a href="./jogo/">Jogar no navegador</a>
        <a href="./politica-de-privacidade/">Política de privacidade</a>
      </nav>
      <footer>
        Um projeto de Gutemberg Brito ·
        <a href="https://gutembergbs.github.io/portfolio/">Portfólio</a>
      </footer>
    </main>
  </body>
</html>
